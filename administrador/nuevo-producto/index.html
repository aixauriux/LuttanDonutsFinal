<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Luttan Donuts
    </title>
    <link href="estilos.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Nunito:wght@400;600;700;800;900&amp;family=Pacifico&amp;display=swap"
        rel="stylesheet" />
</head>

<body>
    <div class="app-shell admin-shell">
        <aside class="sidebar">
            <header class="sidebar__brand">
                <img alt="" src="../../imagenes/luttan.jpeg" />
                <div>
                    <strong>
                        Luttan
                    </strong>
                    <span>
                        Donuts
                    </span>
                </div>
            </header>
            <a class="sidebar__user" href="../perfil/index.html">
                <span class="avatar">
                    AS
                </span>
                <span>
                    <strong>
                        Aixa Sanchez
                    </strong>
                    <small>
                        Administradora
                    </small>
                </span>
            </a>
            <nav aria-label="Navegaci&oacute;n de administraci&oacute;n" class="sidebar__nav">
                <a href="../inicio/index.html">
                    ⌂
                    <span>
                        Inicio
                    </span>
                </a>
                <a href="../ventas/index.html">
                    ▣
                    <span>
                        Ventas
                    </span>
                </a>
                <a href="../inventario/index.html">
                    &square;
                    <span>
                        Inventario
                    </span>
                </a>
                <a href="../productos/index.html">
                    ◉
                    <span>
                        Productos
                    </span>
                </a>
                <a href="../clientes/index.html">
                    ♙
                    <span>
                        Clientes
                    </span>
                </a>
                <a href="../empleados/index.html">
                    ♟
                    <span>
                        Empleados
                    </span>
                </a>
                <a href="../gastos/index.html">
                    $
                    <span>
                        Gastos
                    </span>
                </a>
                <a href="../caja/index.html">
                    ▤
                    <span>
                        Caja
                    </span>
                </a>
                <a href="../reportes/index.html">
                    ▥
                    <span>
                        Reportes
                    </span>
                </a>
            </nav>
            <a class="sidebar__logout" href="../inicio-sesion/index.html">
                ⌑ Cerrar sesi&oacute;n
            </a>
        </aside>
        <main class="workspace">
            <section class="page admin-page" id="product-new">
                <header class="topbar">
                    <div>
                        <h1>
                            Nuevo Producto
                        </h1>
                        <p>
                            Informaci&oacute;n del producto
                        </p>
                    </div>
                    <a class="button button--soft" href="../productos/index.html">
                        Volver
                    </a>
                </header>
                <div class="page__content">
                    <article class="panel form-card">
                        <form action="../productos/index.html" class="form-stack">
                            <label class="field">
                                Nombre del producto
                                <input placeholder="Ej: Dona de Fresa Especial" required="" />
                            </label>
                            <label class="field">
                                Descripci&oacute;n
                                <textarea placeholder="Describe el producto..."></textarea>
                            </label>
                            <div class="form-grid">
                                <label class="field">
                                    Precio
                                    <input placeholder="0" type="number" />
                                </label>
                                <label class="field">
                                    Categor&iacute;a
                                    <select>
                                        <option>
                                            Cl&aacute;sica
                                        </option>
                                        <option>
                                            Rellena
                                        </option>
                                        <option>
                                            Especial
                                        </option>
                                        <option>
                                            Glaseada
                                        </option>
                                    </select>
                                </label>
                            </div>
                            <label class="field">
                                Cantidad disponible
                                <input placeholder="0" type="number" />
                            </label>
                            <label class="upload-box">
                                Selecciona una imagen
                                <input accept="image/ /&gt;&lt;/label&gt;&lt;div class=" form-actions"="" type="file" />
                                <button class="button" type="submit">
                                    Guardar producto
                                </button>
                                <a class="button button--soft" href="../productos/index.html">
                                    Cancelar
                                </a>
                            </label>
                        </form>
                    </article>
                </div>
            </section>
        </main>
    </div>
    <script src="../../funciones.js" defer></script>
</body>

</html>
