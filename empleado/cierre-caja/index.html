<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Luttan Donuts
    </title>
    <link href="estilos.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Nunito:wght@400;600;700;800;900&amp;family=Pacifico&amp;display=swap"
        rel="stylesheet" />
</head>

<body>
    <div class="app-shell employee-shell">
        <aside class="sidebar">
            <header class="sidebar__brand">
                <img alt="" src="../../imagenes/luttan.jpeg" />
                <div>
                    <strong>
                        Luttan
                    </strong>
                    <span>
                        Donuts
                    </span>
                </div>
            </header>
            <div class="sidebar__user">
                <span class="avatar avatar--amber">
                    DH
                </span>
                <span>
                    <strong>
                        Diego Herrera
                    </strong>
                    <small>
                        Empleado
                    </small>
                </span>
            </div>
            <nav class="sidebar__nav">
                <a href="../inicio/index.html">
                    ⌂
                    <span>
                        Inicio
                    </span>
                </a>
                <a href="../ventas/index.html">
                    ▣
                    <span>
                        Ventas
                    </span>
                </a>
                <a href="../inventario/index.html">
                    &square;
                    <span>
                        Inventario
                    </span>
                </a>
                <a href="../clientes/index.html">
                    ♙
                    <span>
                        Clientes
                    </span>
                </a>
                <a href="../caja/index.html">
                    ▤
                    <span>
                        Caja
                    </span>
                </a>
                <a href="../cierre-caja/index.html">
                    ⌑
                    <span>
                        Cierre de caja
                    </span>
                </a>
            </nav>
            <a class="sidebar__logout" href="../inicio-sesion/index.html">
                ⌑ Cerrar sesi&oacute;n
            </a>
        </aside>
        <main class="workspace">
            <section class="page employee-page" id="employee-close">
                <header class="topbar">
                    <div>
                        <h1>
                            Cierre de Caja
                        </h1>
                        <p>
                            Finaliza tu turno
                        </p>
                    </div>
                    <a class="button button--soft" href="../caja/index.html">
                        Volver
                    </a>
                </header>
                <div class="page__content close-grid">
                    <article class="panel summary-list">
                        <h2>
                            Resumen del cierre
                        </h2>
                        <p>
                            <span>
                                Ventas del d&iacute;a
                            </span>
                            <strong class="positive">
                                $350,000
                            </strong>
                        </p>
                        <p>
                            <span>
                                Egresos del d&iacute;a
                            </span>
                            <strong class="negative">
                                $80,000
                            </strong>
                        </p>
                        <p>
                            <span>
                                Dinero esperado
                            </span>
                            <strong>
                                $270,000
                            </strong>
                        </p>
                    </article>
                    <article class="panel">
                        <h2>
                            Arqueo de caja
                        </h2>
                        <form action="../caja/index.html" class="form-stack">
                            <label class="field">
                                Dinero contado en efectivo
                                <input type="number" value="270000" />
                            </label>
                            <div class="difference">
                                <span>
                                    Diferencia
                                </span>
                                <strong>
                                    $0
                                </strong>
                            </div>
                            <label class="field">
                                Observaciones
                                <textarea placeholder="Sin novedad en el turno..."></textarea>
                            </label>
                            <button class="button button--gradient">
                                Confirmar cierre de caja
                            </button>
                        </form>
                    </article>
                </div>
            </section>
        </main>
    </div>
    <script src="../../funciones.js" defer></script>
</body>

</html>
