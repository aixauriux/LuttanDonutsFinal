<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Luttan Donuts
    </title>
    <link href="estilos.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Nunito:wght@400;600;700;800;900&amp;family=Pacifico&amp;display=swap"
        rel="stylesheet" />
</head>

<body>
    <div class="app-shell employee-shell">
        <aside class="sidebar">
            <header class="sidebar__brand">
                <img alt="" src="../../imagenes/luttan.jpeg" />
                <div>
                    <strong>
                        Luttan
                    </strong>
                    <span>
                        Donuts
                    </span>
                </div>
            </header>
            <div class="sidebar__user">
                <span class="avatar avatar--amber">
                    DH
                </span>
                <span>
                    <strong>
                        Diego Herrera
                    </strong>
                    <small>
                        Empleado
                    </small>
                </span>
            </div>
            <nav class="sidebar__nav">
                <a href="../inicio/index.html">
                    ⌂
                    <span>
                        Inicio
                    </span>
                </a>
                <a href="../ventas/index.html">
                    ▣
                    <span>
                        Ventas
                    </span>
                </a>
                <a href="../inventario/index.html">
                    &square;
                    <span>
                        Inventario
                    </span>
                </a>
                <a href="../clientes/index.html">
                    ♙
                    <span>
                        Clientes
                    </span>
                </a>
                <a href="../caja/index.html">
                    ▤
                    <span>
                        Caja
                    </span>
                </a>
                <a href="../cierre-caja/index.html">
                    ⌑
                    <span>
                        Cierre de caja
                    </span>
                </a>
            </nav>
            <a class="sidebar__logout" href="../inicio-sesion/index.html">
                ⌑ Cerrar sesi&oacute;n
            </a>
        </aside>
        <main class="workspace">
            <section class="page employee-page" id="employee-sale-new">
                <header class="topbar">
                    <div>
                        <h1>
                            Registrar Venta
                        </h1>
                        <p>
                            Nueva venta
                        </p>
                    </div>
                    <a class="button button--soft" href="../ventas/index.html">
                        Volver
                    </a>
                </header>
                <div class="page__content">
                    <article class="panel form-card">
                        <form action="../ventas/index.html" class="form-stack">
                            <label class="field">
                                Cliente
                                <select>
                                    <option>
                                        Mar&iacute;a L&oacute;pez
                                    </option>
                                    <option>
                                        Carlos Ruiz
                                    </option>
                                    <option>
                                        Cliente nuevo
                                    </option>
                                </select>
                            </label>
                            <label class="field">
                                Producto
                                <select>
                                    <option>
                                        Dona Glaseada &mdash; $3,800
                                    </option>
                                    <option>
                                        Dona de Fresa &mdash; $4,500
                                    </option>
                                </select>
                            </label>
                            <div class="form-grid">
                                <label class="field">
                                    Cantidad
                                    <input type="number" value="5" />
                                </label>
                                <label class="field">
                                    Precio unitario
                                    <input value="$3,800" />
                                </label>
                            </div>
                            <div class="total-box">
                                <span>
                                    Total a cobrar
                                </span>
                                <strong>
                                    $19,000
                                </strong>
                            </div>
                            <fieldset class="payment-method">
                                <legend>
                                    M&eacute;todo de pago
                                </legend>
                                <label>
                                    <input checked="" name="payment" type="radio" />
                                    Efectivo
                                </label>
                                <label>
                                    <input name="payment" type="radio" />
                                    Tarjeta
                                </label>
                                <label>
                                    <input name="payment" type="radio" />
                                    Transferencia
                                </label>
                            </fieldset>
                            <button class="button">
                                Registrar venta
                            </button>
                        </form>
                    </article>
                </div>
            </section>
        </main>
    </div>
    <script src="../../funciones.js" defer></script>
</body>

</html>
